name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (python-3.13)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install zsh and packaging tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh dpkg-dev fakeroot rpm

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package (with dev extras when available)
        run: |
          if python -m pip install -e ".[dev]"; then
            echo "Installed with [dev] extra."
          else
            echo "Falling back to plain editable install."
            python -m pip install -e .
          fi

      - name: Ensure build/quality tools are available
        run: python -m pip install --upgrade pytest ruff build twine uv

      - name: Run pytest
        run: pytest -q

      - name: Run language conformance suite
        run: python scripts/run_language_conformance.py

      - name: Run ruff
        run: ruff check src tests

      - name: Verify release metadata contract (version/changelog, no tag required)
        run: bash scripts/check_release_metadata.sh

      - name: Build sdist and wheel
        run: |
          rm -rf dist build
          python -m build

      - name: Validate package metadata
        run: twine check dist/*

      - name: Smoke test (pysh --version)
        run: pysh --version

      - name: Smoke test (python -m pysh --version)
        run: python -m pysh --version

      - name: Syntax-check packaging shell scripts
        run: |
          bash -n scripts/build_pysh_package.sh
          bash -n scripts/build_deb.sh
          bash -n scripts/build_rpm.sh
          bash -n scripts/build_release_artifacts.sh
          bash -n scripts/check_release_artifacts.sh
          sh -n packaging/wrappers/pysh.sh
          sh -n scripts/_freebsd_python.sh
          sh -n scripts/build_freebsd_pkg.sh
          sh -n scripts/smoke_freebsd_package.sh

      - name: Build Debian .deb (if dpkg-deb available)
        run: |
          if command -v dpkg-deb >/dev/null 2>&1; then
            bash scripts/build_deb.sh
          else
            echo "dpkg-deb not available; skipping .deb build."
          fi

      - name: Debian package real install-and-run smoke (isolated debian:13-slim container)
        run: bash scripts/smoke_debian_package.sh dist/os/deb/*.deb

      - name: Build RPM .rpm (if rpmbuild available)
        run: |
          if command -v rpmbuild >/dev/null 2>&1; then
            bash scripts/build_rpm.sh
          else
            echo "rpmbuild not available; skipping .rpm build."
          fi

      - name: RPM package real install-and-run smoke (isolated Fedora container)
        run: bash scripts/smoke_rpm_package.sh dist/os/rpm/*.rpm

      - name: Verify artifact contract (portable, non-native)
        run: |
          set -euo pipefail

          . scripts/_pysh_version.sh
          VERSION="$(pysh_read_version pyproject.toml)"

          CONTRACT_DIR="$(mktemp -d)"
          trap 'rm -rf "${CONTRACT_DIR}"' EXIT

          mkdir -p "${CONTRACT_DIR}/os/deb" "${CONTRACT_DIR}/os/rpm" "${CONTRACT_DIR}/os/freebsd"
          cp dist/*.whl "${CONTRACT_DIR}/"
          cp dist/*.tar.gz "${CONTRACT_DIR}/"
          cp dist/os/deb/*.deb "${CONTRACT_DIR}/os/deb/"
          cp dist/os/rpm/*.rpm "${CONTRACT_DIR}/os/rpm/"

          # A real FreeBSD .pkg cannot be produced on this ubuntu-latest
          # runner. Native FreeBSD package validation happens for real in
          # .github/workflows/release-artifacts.yml via native FreeBSD VMs
          # build. This is a clearly labeled, non-empty CONTRACT-ONLY
          # fixture used solely to exercise naming/presence/checksum
          # semantics here; it is never copied into dist/, never staged as
          # a release asset, and never uploaded anywhere. It is discarded
          # with the rest of ${CONTRACT_DIR} when this step ends.
          cat >"${CONTRACT_DIR}/os/freebsd/pysh-shell-${VERSION}.pkg" <<'FIXTURE'
          PYSH ARTIFACT-CONTRACT TEST FIXTURE - NOT A REAL FREEBSD PACKAGE.
          This file exists only to exercise
          scripts/check_release_artifacts.sh --contract-only naming,
          presence, and checksum semantics in ordinary Linux CI, where a
          live FreeBSD builder is unavailable. Real FreeBSD .pkg validation
          runs in .github/workflows/release-artifacts.yml via native FreeBSD
          VM builds.
          FIXTURE

          bash scripts/check_release_artifacts.sh --contract-only "${CONTRACT_DIR}"

  platform-debian:
    name: platform reference (debian-13, amd64, python-3.13)
    runs-on: ubuntu-latest
    container:
      image: debian:13-slim
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Debian reference tooling
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            bash ca-certificates git python3.13 python3.13-venv

      - name: Run platform-sensitive contracts in Debian 13
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "${ID}" = "debian"
          test "${VERSION_ID}" = "13"
          test "$(dpkg --print-architecture)" = "amd64"

          python3.13 -m venv .venv-debian
          . .venv-debian/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pygments
          export TERM=xterm-256color

          echo "==> Language conformance"
          python scripts/run_language_conformance.py
          python -m pytest -q tests/test_language_conformance.py

          python -m pytest -q \
            tests/test_parser.py \
            tests/test_parser_foundation.py \
            tests/test_multiline_grammar.py \
            tests/test_env_assignment.py \
            tests/test_expansion_foundation.py \
            tests/test_path_expansion.py \
            tests/test_heredoc.py \
            tests/test_substitution.py \
            tests/test_shell.py \
            tests/test_pty_integration.py \
            tests/test_pty_smoke_helper.py \
            tests/test_resize.py \
            tests/test_secure_runner.py \
            tests/test_signal_handling.py \
            tests/test_job_control.py \
            tests/test_redirection.py \
            tests/test_isolated_plugin_runtime.py \
            tests/test_safe_startup.py \
            tests/test_rc.py \
            tests/test_pyshrc_py.py \
            tests/test_platform_tier_contract.py

      - name: Run resource governor evidence
        shell: bash
        run: |
          set -euo pipefail
          . .venv-debian/bin/activate
          export TERM=xterm-256color
          PYSH_PYTEST="python -m pytest" \
            sh scripts/check_resource_governor_evidence.sh

  platform-freebsd:
    name: platform reference (freebsd-14.4, amd64, python-3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run platform-sensitive contracts in FreeBSD 14.4
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.4"
          usesh: true
          prepare: |
            pkg update -f
            pkg install -y bash python313 uv git
          run: |
            set -eu
            test "$(uname -s)" = "FreeBSD"
            test "$(freebsd-version -u | cut -d- -f1)" = "14.4"
            test "$(uname -m)" = "amd64"
            command -v bash

            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            uv venv --python python3.13 .venv-freebsd
            uv pip install --python .venv-freebsd/bin/python -e . pytest pygments
            export PATH="$PWD/.venv-freebsd/bin:/usr/local/bin:/usr/bin:/bin"
            export TERM=xterm-256color

            echo "==> Language conformance"
            python scripts/run_language_conformance.py
            python -m pytest -q tests/test_language_conformance.py

            python -m pytest -q \
              tests/test_parser.py \
              tests/test_parser_foundation.py \
              tests/test_multiline_grammar.py \
              tests/test_env_assignment.py \
              tests/test_expansion_foundation.py \
              tests/test_path_expansion.py \
              tests/test_heredoc.py \
              tests/test_substitution.py \
              tests/test_shell.py

            echo "==> Native PTY, termios, signal, and job-control behavior"
            python -m pytest -q \
              tests/test_pty_integration.py \
              tests/test_pty_smoke_helper.py \
              tests/test_resize.py \
              tests/test_secure_runner.py \
              tests/test_signal_handling.py \
              tests/test_job_control.py

            python -m pytest -q \
              tests/test_redirection.py \
              tests/test_isolated_plugin_runtime.py \
              tests/test_safe_startup.py \
              tests/test_rc.py \
              tests/test_pyshrc_py.py \
              tests/test_platform_tier_contract.py

            echo "==> Resource governor evidence"
            PYSH_PYTEST="python -m pytest" \
              sh scripts/check_resource_governor_evidence.sh

  performance-linux:
    name: performance (linux, python-3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run release-blocking performance contract
        run: |
          python scripts/benchmark_performance.py \
            --profile linux-python3-13 \
            --output artifacts/performance/linux-python3-13.json

      - name: Upload Linux performance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: performance-linux-python3-13
          path: artifacts/performance/linux-python3-13.json
          if-no-files-found: error

  performance-freebsd:
    name: performance (freebsd-14.4, python-3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run release-blocking performance contract in FreeBSD 14.4
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.4"
          usesh: true
          prepare: |
            pkg update -f
            pkg install -y python313
          run: |
            set -eu
            test "$(uname -s)" = "FreeBSD"
            python3.13 --version
            mkdir -p artifacts/performance
            python3.13 scripts/benchmark_performance.py \
              --profile freebsd-14-4-python3-13 \
              --output artifacts/performance/freebsd-14.4-python3-13.json

      - name: Upload FreeBSD performance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: performance-freebsd-14.4-python3-13
          path: artifacts/performance/freebsd-14.4-python3-13.json
          if-no-files-found: error
