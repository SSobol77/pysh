name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (python-3.13)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install zsh and packaging tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh dpkg-dev fakeroot rpm

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package (with dev extras when available)
        run: |
          if python -m pip install -e ".[dev]"; then
            echo "Installed with [dev] extra."
          else
            echo "Falling back to plain editable install."
            python -m pip install -e .
          fi

      - name: Ensure build/quality tools are available
        run: python -m pip install --upgrade pytest ruff build twine

      - name: Run pytest
        run: pytest -q

      - name: Run ruff
        run: ruff check src tests

      - name: Verify release metadata contract (version/changelog, no tag required)
        run: bash scripts/check_release_metadata.sh

      - name: Build sdist and wheel
        run: |
          rm -rf dist build
          python -m build

      - name: Validate package metadata
        run: twine check dist/*

      - name: Smoke test (pysh --version)
        run: pysh --version

      - name: Smoke test (python -m pysh --version)
        run: python -m pysh --version

      - name: Syntax-check packaging shell scripts
        run: |
          bash -n scripts/build_pysh_package.sh
          bash -n scripts/build_deb.sh
          bash -n scripts/build_rpm.sh
          bash -n scripts/build_release_artifacts.sh
          bash -n scripts/check_release_artifacts.sh

      - name: Build Debian .deb (if dpkg-deb available)
        run: |
          if command -v dpkg-deb >/dev/null 2>&1; then
            bash scripts/build_deb.sh
          else
            echo "dpkg-deb not available; skipping .deb build."
          fi

      - name: Build RPM .rpm (if rpmbuild available)
        run: |
          if command -v rpmbuild >/dev/null 2>&1; then
            bash scripts/build_rpm.sh
          else
            echo "rpmbuild not available; skipping .rpm build."
          fi

      - name: Verify artifact contract (portable, non-native)
        run: |
          set -euo pipefail

          . scripts/_pysh_version.sh
          VERSION="$(pysh_read_version pyproject.toml)"

          CONTRACT_DIR="$(mktemp -d)"
          trap 'rm -rf "${CONTRACT_DIR}"' EXIT

          mkdir -p "${CONTRACT_DIR}/os/deb" "${CONTRACT_DIR}/os/rpm" "${CONTRACT_DIR}/os/freebsd"
          cp dist/*.whl "${CONTRACT_DIR}/"
          cp dist/*.tar.gz "${CONTRACT_DIR}/"
          cp dist/os/deb/*.deb "${CONTRACT_DIR}/os/deb/"
          cp dist/os/rpm/*.rpm "${CONTRACT_DIR}/os/rpm/"

          # A real FreeBSD .pkg cannot be produced on this ubuntu-latest
          # runner. Native FreeBSD package validation happens for real in
          # .github/workflows/release-artifacts.yml via a FreeBSD 14+ VM
          # build. This is a clearly labeled, non-empty CONTRACT-ONLY
          # fixture used solely to exercise naming/presence/checksum
          # semantics here; it is never copied into dist/, never staged as
          # a release asset, and never uploaded anywhere. It is discarded
          # with the rest of ${CONTRACT_DIR} when this step ends.
          cat >"${CONTRACT_DIR}/os/freebsd/pysh-shell-${VERSION}.pkg" <<'FIXTURE'
          PYSH ARTIFACT-CONTRACT TEST FIXTURE - NOT A REAL FREEBSD PACKAGE.
          This file exists only to exercise
          scripts/check_release_artifacts.sh --contract-only naming,
          presence, and checksum semantics in ordinary Linux CI, where a
          live FreeBSD builder is unavailable. Real FreeBSD .pkg validation
          runs in .github/workflows/release-artifacts.yml via a FreeBSD 14+
          VM build.
          FIXTURE

          bash scripts/check_release_artifacts.sh --contract-only "${CONTRACT_DIR}"
