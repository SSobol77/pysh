name: Release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:

# Least privilege (Issue #51, Slice 3): the workflow default is read-only. Each job
# below declares exactly what it needs; attestation and OIDC rights exist ONLY in
# build-and-validate, and the only write to repository contents (the release upload)
# exists ONLY in the upload job.
permissions:
  contents: read

jobs:
  freebsd-pkg:
    name: Build FreeBSD ${{ matrix.release }} .pkg
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "14.4"
            artifact: freebsd-reference-pkg
            reference-pkg: true
          - release: "15"
            artifact: freebsd-validation-15
            reference-pkg: false
    # Safety bound (Issue #33): the real run this job performs -- VM boot,
    # pkg bootstrap, build, static inspection, and the full install-and-run
    # smoke -- reached the interactive PTY step in under a minute in the
    # one real run observed so far. 20 minutes is ample margin without
    # letting an infrastructure or test-harness regression consume ~90
    # minutes again (as happened when the old unbounded PTY read hung).
    # Exceeding this must FAIL the job outright, never be masked.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and inspect FreeBSD .pkg
        uses: vmactions/freebsd-vm@v1
        with:
          release: "${{ matrix.release }}"
          usesh: true
          prepare: |
            pkg update -f
            pkg install -y python313
          run: |
            set -eu
            export PYSH_FREEBSD_PYTHON_VERSION=3.13
            test "$(uname -s)" = "FreeBSD"
            major="$(uname -r | awk -F. '{print $1}')"
            test "${major}" = "$(printf '%s' '${{ matrix.release }}' | cut -d. -f1)"
            test "$(uname -m)" = "amd64"
            python3.13 --version
            pkg --version
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
            PKG_PATH="dist/os/freebsd/pysh-shell-${VERSION}.pkg"
            sh scripts/build_freebsd_pkg.sh
            test -f "${PKG_PATH}"
            pkg info -F "${PKG_PATH}"
            test "$(pkg query -F "${PKG_PATH}" "%q")" = "$(pkg config ABI)"
            pkg query -F "${PKG_PATH}" "%Fp" | tee /tmp/pysh-freebsd-pkg-files
            grep -Fx /usr/local/bin/pysh /tmp/pysh-freebsd-pkg-files
            grep -E '^/usr/local/lib/pysh-shell/pysh(/|$)' \
              /tmp/pysh-freebsd-pkg-files
            sh scripts/smoke_freebsd_package.sh "${PKG_PATH}"

      - name: Verify FreeBSD .pkg artifact on host
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          test -f "dist/os/freebsd/pysh-shell-${VERSION}.pkg"

      - name: Upload FreeBSD .pkg workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/os/freebsd/pysh-shell-*.pkg
          if-no-files-found: error

  build-and-validate:
    name: Build artifacts & validate release contract
    runs-on: ubuntu-latest
    needs: freebsd-pkg
    # Keyless attestation needs the GitHub OIDC token (id-token), the Artifact
    # Attestations API (attestations) and the artifact metadata record
    # (artifact-metadata). No contents: write, no packages, no other scope.
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install packaging tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot rpm

      - name: Install Python build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      # Metadata/changelog/tag validation runs before any artifact is built,
      # so a version-drift or unfinalized-changelog problem fails fast
      # without spending the cost of building wheel/sdist/deb/rpm.
      - name: Verify release metadata contract (release mode)
        if: github.event_name != 'release'
        run: bash scripts/check_release_metadata.sh --release-mode

      - name: Verify release metadata contract (release mode, with tag)
        if: github.event_name == 'release'
        run: |
          bash scripts/check_release_metadata.sh --release-mode \
            --tag "${{ github.event.release.tag_name }}"

      - name: Build PyPI artifacts
        run: bash scripts/build_pysh_package.sh

      - name: Build Debian .deb
        run: bash scripts/build_deb.sh

      - name: Build RPM .rpm
        run: bash scripts/build_rpm.sh

      - name: RPM package real install-and-run smoke (isolated Fedora container)
        run: bash scripts/smoke_rpm_package.sh dist/os/rpm/*.rpm

      - name: Download FreeBSD .pkg
        uses: actions/download-artifact@v4
        with:
          name: freebsd-reference-pkg
          path: dist/os/freebsd

      - name: Verify canonical artifact names + stage flat release assets
        run: bash scripts/check_release_artifacts.sh

      # Issue #51 (Slice 2): SPDX 2.3 JSON SBOMs for the five package artifacts,
      # generated ONLY from the validated canonical bytes staged above. The SBOM
      # tool is CI-only equipment pinned by version and archive SHA-256 inside
      # scripts/generate_release_sboms.py; it never uploads anything. The sequence
      # is: generate, validate completeness, write the final SHA256SUMS over the
      # complete published set, validate the whole bundle, and only then hand the
      # bundle to the upload job.
      - name: Fetch pinned SBOM tool (CI-only, digest-verified)
        run: python scripts/generate_release_sboms.py fetch-syft --dest "${RUNNER_TEMP}/sbom-tool"

      - name: Generate SPDX 2.3 JSON SBOMs for the staged package artifacts
        run: |
          python scripts/generate_release_sboms.py generate \
            --input dist/release-assets \
            --output dist/release-assets \
            --syft "${RUNNER_TEMP}/sbom-tool/syft"

      - name: Validate SBOM completeness
        run: python scripts/generate_release_sboms.py validate --dir dist/release-assets

      - name: Finalize SHA256SUMS over the complete published set
        run: bash scripts/check_release_artifacts.sh --finalize-release-assets

      - name: Validate the complete release bundle (packages, SBOMs, SHA256SUMS)
        run: python scripts/generate_release_sboms.py validate-bundle --dir dist/release-assets

      # Issue #51 (Slice 3): keyless GitHub OIDC attestations over the FINAL bytes only.
      # Trust model: GitHub Actions workflow identity + GitHub OIDC token + a short-lived
      # Sigstore certificate + the GitHub Artifact Attestations service. There is no
      # long-lived signing key, no GPG secret and no second signing path. The subjects
      # come from the final SHA256SUMS through scripts/prepare_attestation_subjects.py,
      # never from a hardcoded file-name list. Nothing here uploads release assets.
      - name: Prepare exact attestation subjects (from the final SHA256SUMS)
        id: subjects
        run: |
          python scripts/prepare_attestation_subjects.py \
            --assets-dir dist/release-assets \
            --github-output "${GITHUB_OUTPUT}"

      - name: Attest provenance for the SHA256SUMS subjects (packages and SBOM files)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # actions/attest v4.2.2
        with:
          subject-checksums: dist/release-assets/SHA256SUMS

      - name: Attest provenance for SHA256SUMS itself
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # actions/attest v4.2.2
        with:
          subject-name: ${{ steps.subjects.outputs.checksums_name }}
          subject-digest: sha256:${{ steps.subjects.outputs.checksums_sha256 }}

      - name: Attest SPDX SBOM (wheel)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # actions/attest v4.2.2
        with:
          subject-name: ${{ steps.subjects.outputs.wheel_name }}
          subject-digest: sha256:${{ steps.subjects.outputs.wheel_sha256 }}
          sbom-path: ${{ steps.subjects.outputs.wheel_sbom_path }}

      - name: Attest SPDX SBOM (sdist)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # actions/attest v4.2.2
        with:
          subject-name: ${{ steps.subjects.outputs.sdist_name }}
          subject-digest: sha256:${{ steps.subjects.outputs.sdist_sha256 }}
          sbom-path: ${{ steps.subjects.outputs.sdist_sbom_path }}

      - name: Attest SPDX SBOM (deb)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # actions/attest v4.2.2
        with:
          subject-name: ${{ steps.subjects.outputs.deb_name }}
          subject-digest: sha256:${{ steps.subjects.outputs.deb_sha256 }}
          sbom-path: ${{ steps.subjects.outputs.deb_sbom_path }}

      - name: Attest SPDX SBOM (rpm)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # actions/attest v4.2.2
        with:
          subject-name: ${{ steps.subjects.outputs.rpm_name }}
          subject-digest: sha256:${{ steps.subjects.outputs.rpm_sha256 }}
          sbom-path: ${{ steps.subjects.outputs.rpm_sbom_path }}

      - name: Attest SPDX SBOM (freebsd_pkg)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # actions/attest v4.2.2
        with:
          subject-name: ${{ steps.subjects.outputs.freebsd_pkg_name }}
          subject-digest: sha256:${{ steps.subjects.outputs.freebsd_pkg_sha256 }}
          sbom-path: ${{ steps.subjects.outputs.freebsd_pkg_sbom_path }}

      # Verification-before-upload: all eleven provenance attestations and all five SBOM
      # attestations must verify against the pinned repository, the pinned signer
      # workflow and this exact source commit BEFORE the bundle is handed off. A failure
      # here means the upload job has nothing to download.
      - name: Verify every attestation before the hand-off (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/verify_release_attestations.py \
            --assets-dir dist/release-assets \
            --repo SSobol77/pysh \
            --signer-workflow SSobol77/pysh/.github/workflows/release-artifacts.yml \
            --source-digest "${GITHUB_SHA}"

      # The validated, flat dist/release-assets/ tree is the ONLY thing the
      # upload job can see: it never has repository source, never rebuilds
      # anything, and cannot run until this job succeeds. This is the
      # explicit validate -> upload job boundary (Issue #33 RQG-G): a
      # failure anywhere above (metadata, any build, naming, checksum)
      # means this upload never happens, and the upload job has nothing to
      # download.
      - name: Upload validated release assets for the upload job
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/release-assets/*
          if-no-files-found: error

  upload:
    name: Attach validated assets to GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-validate
    if: github.event_name == 'release'
    # The only job that may write release assets. No OIDC token, no attestation
    # rights: it never signs, rebuilds or verifies anything.
    permissions:
      contents: write

    steps:
      - name: Download validated release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/release-assets

      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          gh release upload "${TAG}" \
            dist/release-assets/* \
            --repo "${{ github.repository }}" \
            --clobber
